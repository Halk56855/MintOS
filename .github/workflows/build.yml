name: Build ProjectNERV for A04

on:
  workflow_dispatch:
    inputs:
      target_firmware:
        description: "Galaxy A04 firmware string (MODEL/CSC/IMEI_OR_SERIAL)"
        required: false
        default: "SM-A045F/XSG/352353115333368"
      source_firmware:
        description: "Source firmware string (MODEL/CSC/IMEI_OR_SERIAL)"
        required: false
        default: "SM-A057F/XXV/357533641234561"
  pull_request:
  push:
    branches:
      - 'paradigm'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Sync target/a04 and target/a05s from UN1CA-a04-a34x (sixteen)
        run: |
          set -e
          rm -rf /tmp/unica_src
          git clone --depth=1 --branch sixteen https://github.com/DaniHasReal/UN1CA-a04-a34x.git /tmp/unica_src
          mkdir -p target/a04 target/a05s
          if [ -d "/tmp/unica_src/target/a04" ]; then
            cp -rf /tmp/unica_src/target/a04/. target/a04/
          fi
          if [ -d "/tmp/unica_src/target/a05s" ]; then
            cp -rf /tmp/unica_src/target/a05s/. target/a05s/
          fi
          rm -rf /tmp/unica_src
          echo "--- Available unica/configs ---"
          ls -1 unica/configs || true

      - name: Initialize submodules (skip broken target/a53x/patches/vendor)
        run: |
          set -e
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          rm -rf .git/modules/target/a53x/patches/vendor target/a53x/patches/vendor
          git config --remove-section submodule.target/a53x/patches/vendor 2>/dev/null || true
          git config -f .gitmodules --remove-section submodule.target/a53x/patches/vendor 2>/dev/null || true
          git -c protocol.version=2 submodule update --init --force --depth=1 --recursive external/android-tools external/apktool external/erofs-utils external/img2sdat external/samloader external/signapk external/smali
          git submodule status -- external/android-tools external/apktool external/erofs-utils external/img2sdat external/samloader external/signapk external/smali

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          set -e
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            "linux-modules-extra-$(uname -r)" || \
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-aws || true
          sudo modprobe erofs f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/platform.x509.pem

      - name: Install samloader-rs from topjohnwu/samloader-rs.git
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustc --version
          cargo --version
          cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader --locked || \
          cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader
          BIN_PATH="$(command -v samloader || command -v samloader-rs)"
          [ -n "$BIN_PATH" ]
          mkdir -p out/tools/venv/bin "$HOME/.cargo/bin"
          if [ "$BIN_PATH" != "$HOME/.cargo/bin/samloader" ]; then
            ln -sf "$BIN_PATH" "$HOME/.cargo/bin/samloader"
          fi
          if [ "$BIN_PATH" != "$HOME/.cargo/bin/samloader-rs" ]; then
            ln -sf "$BIN_PATH" "$HOME/.cargo/bin/samloader-rs"
          fi
          ln -sf "$BIN_PATH" "out/tools/venv/bin/samloader-rs"
          ln -sf "$BIN_PATH" "out/tools/venv/bin/samloader"
          printf '%s\n' '#!/bin/bash' "export PATH=\"$PWD/out/tools/venv/bin:\$HOME/.cargo/bin:\$PATH\"" > out/tools/venv/bin/activate
          chmod +x out/tools/venv/bin/activate
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Clone Samsung Galaxy A04 trees
        run: |
          set -e
          mkdir -p ~/a04_trees
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git ~/a04_trees/device
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git ~/a04_trees/vendor
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git ~/a04_trees/kernel
          echo "A04_DEVICE_TREE=$HOME/a04_trees/device" >> "$GITHUB_ENV"
          echo "A04_VENDOR_TREE=$HOME/a04_trees/vendor" >> "$GITHUB_ENV"
          echo "A04_KERNEL_TREE=$HOME/a04_trees/kernel" >> "$GITHUB_ENV"

      - name: Configure TARGET_SINGLE_SYSTEM_IMAGE and target configs
        run: |
          set -e
          mkdir -p target/a04 target/a05s unica/configs
          FW_VAL="${{ github.event.inputs.target_firmware }}"
          if [ -z "$FW_VAL" ]; then
            FW_VAL="SM-A045F/XSG/352353115333368"
          fi
          SRC_FW_VAL="SM-A057F/XXV/357533641234561"

          python3 - << 'PYEOF'
          from pathlib import Path
          import re

          for d in [Path("target"), Path("unica/configs")]:
              if d.exists():
                  for f in d.rglob("*"):
                      if f.is_file():
                          try:
                              txt = f.read_text(encoding="utf-8", errors="ignore")
                              new_txt = re.sub(r'SM-S916B/[A-Z0-9_]+/[0-9A-Za-z]+', 'SM-A057F/XXV/357533641234561', txt)
                              new_txt = new_txt.replace("SM-S916B", "SM-A057F")
                              if new_txt != txt:
                                  f.write_text(new_txt, encoding="utf-8")
                          except Exception:
                              pass
          PYEOF

          resolve_ssi() {
            for candidate in "$1" "$2" "qssi" "essi" "self"; do
              if [ -n "$candidate" ] && [ -f "unica/configs/${candidate}.sh" ]; then
                printf '%s' "$candidate"
                return 0
              fi
            done
            local first_cfg
            first_cfg="$(find unica/configs -maxdepth 1 -type f -name '*.sh' ! -name 'version.sh' | sort | head -n 1)"
            if [ -n "$first_cfg" ]; then
              basename "$first_cfg" .sh
            else
              printf 'qssi'
            fi
          }

          SSI_VAL="$(resolve_ssi "qssi" "essi")"
          echo "SOURCE_FIRMWARE=$SRC_FW_VAL" >> "$GITHUB_ENV"
          echo "TARGET_SINGLE_SYSTEM_IMAGE=$SSI_VAL" >> "$GITHUB_ENV"

          python3 - << PYEOF
          from pathlib import Path
          import re

          fw_val = "${FW_VAL}"
          src_fw_val = "${SRC_FW_VAL}"
          ssi_val = "${SSI_VAL}"

          def ensure_vars(cfg_path: Path, defaults: dict, force_keys: set = None):
              force_keys = force_keys or set()
              if not cfg_path.exists():
                  cfg_path.write_text("# Auto-generated config\n", encoding="utf-8")
              txt = cfg_path.read_text(encoding="utf-8", errors="ignore")
              m_sdk = re.search(r'^TARGET_PLATFORM_SDK_VERSION=(.+)$', txt, re.M)
              if m_sdk and not re.search(r'^TARGET_API_LEVEL=', txt, re.M):
                  txt += f"\nTARGET_API_LEVEL={m_sdk.group(1).strip()}\n"
              for k, v in defaults.items():
                  pat = rf'^{re.escape(k)}=.*$'
                  if re.search(pat, txt, re.M):
                      if k in force_keys:
                          txt = re.sub(pat, f"{k}={v}", txt, flags=re.M)
                  else:
                      txt += f"\n{k}={v}\n"
              cfg_path.write_text(txt, encoding="utf-8")

          a04_defaults = {
              "SOURCE_FIRMWARE": f'"{src_fw_val}"',
              "TARGET_NAME": '"Galaxy A04"',
              "TARGET_CODENAME": '"a04"',
              "TARGET_FIRMWARE": f'"{fw_val}"',
              "TARGET_EXTRA_FIRMWARES": "()",
              "TARGET_API_LEVEL": "34",
              "TARGET_PRODUCT_FIRST_API_LEVEL": "32",
              "TARGET_VENDOR_API_LEVEL": "31",
              "TARGET_SINGLE_SYSTEM_IMAGE": f'"{ssi_val}"',
              "TARGET_OS_FILE_SYSTEM": '"erofs"',
              "TARGET_SUPER_PARTITION_SIZE": "7029653504",
              "TARGET_SUPER_GROUP_SIZE": "7025459200",
              "TARGET_HAS_SYSTEM_EXT": "false",
              "TARGET_AUDIO_SUPPORT_ACH_RINGTONE": "false",
              "TARGET_AUDIO_SUPPORT_DUAL_SPEAKER": "false",
              "TARGET_AUDIO_SUPPORT_VIRTUAL_VIBRATION": "false",
              "TARGET_AUTO_BRIGHTNESS_TYPE": "3",
              "TARGET_DVFS_CONFIG_NAME": '"dvfs_policy_mt6765_xx"',
              "TARGET_FP_SENSOR_CONFIG": '"none"',
              "TARGET_HAS_HW_MDNIE": "false",
              "TARGET_HAS_MASS_CAMERA_APP": "true",
              "TARGET_HAS_QHD_DISPLAY": "false",
              "TARGET_HFR_MODE": "1",
              "TARGET_IS_ESIM_SUPPORTED": "false",
              "TARGET_MDNIE_SUPPORTED_MODES": '"45073"',
              "TARGET_MDNIE_WEAKNESS_SOLUTION_FUNCTION": '"0"',
              "TARGET_MULTI_MIC_MANAGER_VERSION": '"07010"',
              "TARGET_SSRM_CONFIG_NAME": '"siop_a04_mt6765"',
          }
          ensure_vars(Path("target/a04/config.sh"), a04_defaults, force_keys={"SOURCE_FIRMWARE"})

          a05s_defaults = {
              "TARGET_FIRMWARE": f'"{src_fw_val}"',
              "TARGET_API_LEVEL": "35",
              "TARGET_PRODUCT_FIRST_API_LEVEL": "33",
              "TARGET_VENDOR_API_LEVEL": "33",
              "TARGET_HAS_SYSTEM_EXT": "true",
              "TARGET_AUDIO_SUPPORT_ACH_RINGTONE": "false",
              "TARGET_AUDIO_SUPPORT_DUAL_SPEAKER": "false",
              "TARGET_AUDIO_SUPPORT_VIRTUAL_VIBRATION": "false",
              "TARGET_AUTO_BRIGHTNESS_TYPE": "2",
              "TARGET_DVFS_CONFIG_NAME": '"dvfs_policy_sm6225_xx"',
              "TARGET_FP_SENSOR_CONFIG": '"google_touch_side,settings=3,navi=1"',
              "TARGET_HAS_HW_MDNIE": "false",
              "TARGET_HAS_MASS_CAMERA_APP": "false",
              "TARGET_HAS_QHD_DISPLAY": "false",
              "TARGET_HFR_MODE": "2",
              "TARGET_IS_ESIM_SUPPORTED": "false",
              "TARGET_MDNIE_SUPPORTED_MODES": '"0"',
              "TARGET_MDNIE_WEAKNESS_SOLUTION_FUNCTION": '"0"',
              "TARGET_MULTI_MIC_MANAGER_VERSION": '"07020"',
              "TARGET_SSRM_CONFIG_NAME": '"siop_a05s_sm6225"',
          }
          ensure_vars(Path("target/a05s/config.sh"), a05s_defaults, force_keys={"TARGET_FIRMWARE"})
          PYEOF

          echo "Using SOURCE_FIRMWARE=$SRC_FW_VAL and TARGET_SINGLE_SYSTEM_IMAGE=$SSI_VAL"
          grep -E "SOURCE_FIRMWARE|TARGET_FIRMWARE|TARGET_SINGLE_SYSTEM_IMAGE" target/a04/config.sh || true

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          set -e
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          source ./buildenv.sh a04
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          ./scripts/build_dependencies.sh

      - name: Prepare samloader-rs environment
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          BIN_PATH="$(command -v samloader || command -v samloader-rs || true)"
          if [ -z "$BIN_PATH" ]; then
            cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader --locked || \
            cargo install --git https://github.com/topjohnwu/samloader-rs.git samloader
            BIN_PATH="$(command -v samloader || command -v samloader-rs)"
          fi
          [ -n "$BIN_PATH" ]
          mkdir -p out/tools/venv/bin "$HOME/.cargo/bin"
          if [ "$BIN_PATH" != "$HOME/.cargo/bin/samloader" ]; then
            ln -sf "$BIN_PATH" "$HOME/.cargo/bin/samloader"
          fi
          if [ "$BIN_PATH" != "$HOME/.cargo/bin/samloader-rs" ]; then
            ln -sf "$BIN_PATH" "$HOME/.cargo/bin/samloader-rs"
          fi
          ln -sf "$BIN_PATH" "out/tools/venv/bin/samloader-rs"
          ln -sf "$BIN_PATH" "out/tools/venv/bin/samloader"
          printf '%s\n' '#!/bin/bash' "export PATH=\"$PWD/out/tools/venv/bin:\$HOME/.cargo/bin:\$PATH\"" > out/tools/venv/bin/activate
          chmod +x out/tools/venv/bin/activate
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Download source firmware
        run: |
          set -e
          export PATH="$PWD/out/tools/venv/bin:$HOME/.cargo/bin:$PATH"
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          source ./buildenv.sh a04
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          ./scripts/download_fw.sh --ignore-target

      - name: Extract source firmware
        run: |
          set -e
          export PATH="$PWD/out/tools/venv/bin:$HOME/.cargo/bin:$PATH"
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          source ./buildenv.sh a04
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          ./scripts/extract_fw.sh --ignore-target

      - name: Download target firmware
        run: |
          set -e
          export PATH="$PWD/out/tools/venv/bin:$HOME/.cargo/bin:$PATH"
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          source ./buildenv.sh a04
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          ./scripts/download_fw.sh --ignore-source

      - name: Extract target firmware
        run: |
          set -e
          export PATH="$PWD/out/tools/venv/bin:$HOME/.cargo/bin:$PATH"
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          source ./buildenv.sh a04
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          ./scripts/extract_fw.sh --ignore-source

      - name: Build ROM
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PWD/out/tools/venv/bin:$PATH"
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          source ./buildenv.sh a04
          export SOURCE_FIRMWARE="SM-A057F/XXV/357533641234561"
          export TARGET_SINGLE_SYSTEM_IMAGE="${TARGET_SINGLE_SYSTEM_IMAGE:-qssi}"
          python3 - << 'PYEOF'
          from pathlib import Path

          apk_sh = Path("scripts/apktool.sh")
          if apk_sh.exists():
              txt = apk_sh.read_text(encoding="utf-8", errors="ignore")
              target_snip = "baksmali d "
              if target_snip in txt and "DexFileNotFoundException" not in txt:
                  lines = txt.splitlines()
                  new_lines = []
                  for line in lines:
                      if "baksmali d " in line and not line.lstrip().startswith("#"):
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f"{indent}{line.strip()} || true")
                      else:
                          new_lines.append(line)
                  apk_sh.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          PYEOF
          if [ -d "unica/patches/deknox" ]; then
            find unica/patches/deknox -type f \( -name "*DualDAR*" -o -name "*StorageManager*" -o -name "*SystemServer*" -o -name "*MdfUtils*" -o -name "*.patch" \) | while read -r pf; do
              if grep -qE "DualDARPolicy|getHdmVersion|StorageManager\.apk|SystemServer\$\$ExternalSyntheticLambda10|Blockchain Service|SemAuthnrService|MdfUtils|BAD_COUNTRY_2LDS|Could not link the library" "$pf" 2>/dev/null || [[ "$pf" == *"StorageManager"* || "$pf" == *"SystemServer"* || "$pf" == *"MdfUtils"* ]]; then
                echo "Removing incompatible patch: $pf"
                rm -f "$pf"
              fi
            done
          fi
          if [ -d "unica/mods/applock" ]; then
            find unica/mods/applock -type f \( -name "*CoreRune*" -o -name "*.patch" \) | while read -r pf; do
              if grep -qE "CoreRune\.smali|FW_SUPPORT_APPLOCK|FW_APPLOCK|Force AppLock support" "$pf" 2>/dev/null || [[ "$pf" == *"CoreRune"* || "$pf" == *"AppLock"* ]]; then
                echo "Removing incompatible AppLock patch: $pf"
                rm -f "$pf"
              fi
            done
          fi
          if [ -d "unica/mods/hooks" ]; then
            find unica/mods/hooks -type f \( -name "*SamsungPropsHooks*" -o -name "*Instrumentation*" -o -name "*SystemProperties*" -o -name "*FloatingFeatureHooks*" -o -name "*SemFloatingFeature*" -o -name "*.patch" \) | while read -r pf; do
              if grep -qE "SamsungPropsHooks|Instrumentation\.smali|SystemProperties\.smali|Introduce SamsungPropsHooks|FloatingFeatureHooks|SemFloatingFeature\.smali|Introduce FloatingFeatureHooks" "$pf" 2>/dev/null || [[ "$pf" == *"SamsungPropsHooks"* || "$pf" == *"FloatingFeatureHooks"* || "$pf" == *"SemFloatingFeature"* ]]; then
                echo "Removing incompatible hooks patch: $pf"
                rm -f "$pf"
              fi
            done
          fi
          bt_patch="unica/patches/bt-lib-patch/customize.sh"
          if [ -f "$bt_patch" ]; then
            printf '#!/usr/bin/env bash\nexit 0\n' > "$bt_patch"
            chmod +x "$bt_patch"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
              [[ "${{ github.ref }}" == "refs/heads/paradigm" ]]; then
              ./scripts/make_rom.sh
          else
              ./scripts/make_rom.sh --no-rom-zip
          fi

      - name: Upload to GoFile
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/paradigm'
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")
          echo "Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
